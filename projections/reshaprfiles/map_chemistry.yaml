dataset:
  model profile: /ocean/rbeutel/MOAD/analysis-becca/projections/reshaprfiles/model_profile.yaml
  time base: day
  variables group: chemistry

dask cluster: salish_cluster.yaml

start date: 2018-01-01
end date: 2022-12-31

extract variables:
  - dissolved_oxygen
  - dissolved_inorganic_carbon
  - total_alkalinity

selection:
  depth:
    # NOTE: use depth level numbers, not depths in meters
    depth min: 23
    depth max: 24

resample:
  time interval: 1MS # 1 month, date is start of month
  aggregation: mean

extracted dataset:
  name: map_chemistry202111
  description: Base scenario (202111), ~50 m depth over the entire model; deptht=23:24
  dest dir: /ocean/rbeutel/MOAD/analysis-becca/projections/summary_results
