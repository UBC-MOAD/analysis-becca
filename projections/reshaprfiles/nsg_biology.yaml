dataset:
  model profile: /ocean/rbeutel/MOAD/analysis-becca/projections/reshaprfiles/model_profile.yaml
  time base: day
  variables group: biology

dask cluster: salish_cluster.yaml

start date: 2018-01-01
end date: 2022-12-31

extract variables:
  - nitrate

selection:
  grid y:
    y min: 650
    y max: 700
  grid x:
    x min: 130
    x max: 180

climatology:
  group by: month
  aggregation: mean

extracted dataset:
  name: nsg_biology202111
  description: Base scenario (202111), NSG region, whole depth, monthly climatology;
              y=650:700, x=130:180
  dest dir: /ocean/rbeutel/MOAD/analysis-becca/projections/summary_results
