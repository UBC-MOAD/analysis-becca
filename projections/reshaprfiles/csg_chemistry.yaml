dataset:
  model profile: /ocean/rbeutel/MOAD/analysis-becca/projections/reshaprfiles/model_profile.yaml
  time base: day
  variables group: chemistry

dask cluster: salish_cluster.yaml

start date: 2018-01-01
end date: 2022-12-31

extract variables:
  - dissolved_oxygen
  - dissolved_inorganic_carbon
  - total_alkalinity

selection:
  grid y:
    y min: 460
    y max: 510
  grid x:
    x min: 240
    x max: 290

climatology:
  group by: month
  aggregation: mean

extracted dataset:
  name: cgs_chemistry202111
  description: Base scenario (202111), CSG region, whole depth, monthly climatology;
              y=460:510, x=240:290
  dest dir: /ocean/rbeutel/MOAD/analysis-becca/projections/summary_results
